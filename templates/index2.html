<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PurrBox - Distributeur de nourriture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ffe0ec 0%, #d4b0ff 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(180, 130, 200, 0.25);
    }

    h1 { text-align: center; color: #a04bbf; margin-bottom: 4px; font-size: 28px; }
    .sous-titre { text-align: center; color: #888; font-size: 14px; margin-bottom: 24px; }

    .carte {
      background: #faf5ff;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 4px solid #c08adc;
    }

    .carte-alerte {
      background: #fff8e1;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 4px solid #ffb300;
      display: none;
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #e65100;
    }
    .carte-alerte.visible { display: block; }

    .chat { width: 100%; height: 350px; background-image: url("/static/Mochi.png"); background-repeat: no-repeat; background-size: contain; border-radius: 10px; }

     @media only screen and (max-width: 480px) {
      .chat {
        width: 100%; height: 250px; background-image: url("/static/Mochi.png"); background-repeat: no-repeat; background-size: contain; border-radius: 10px; 

      }
    } 
    .carte h2 { font-size: 16px; color: #6b3a8a; margin-bottom: 10px; }

    .ligne {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 15px;
    }
    .ligne .valeur { font-weight: 600; color: #a04bbf; }

    .statut-pastille { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #ccc; }
    .statut-pastille-ok { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #86efac; box-shadow: 0 0 0 3px rgba(134,239,172,0.3); }
    .statut-pastille-erreur { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; background: #fca5a5; box-shadow: 0 0 0 3px rgba(252,165,165,0.3); }

    .bouton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #c084fc 0%, #a04bbf 100%);
      color: #fff;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: transform 0.1s;
    }
    .bouton:active { transform: scale(0.97); }
    .bouton:disabled { background: #ccc; cursor: not-allowed; }

    .reglage { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .reglage label { flex: 1; font-size: 15px; }
    .reglage input {
      width: 60px;
      padding: 8px;
      border: 2px solid #d4b0ff;
      border-radius: 8px;
      font-size: 15px;
      text-align: center;
    }

    .message { text-align: center; padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 14px; display: none; }
    .message.ok { background: #e8f5e9; color: #2e7d32; display: block; }
    .message.erreur { background: #ffebee; color: #c62828; display: block; }
  </style>
</head>

<body>
  <div class="container">
    <h1>🐾 PurrBox</h1>
    <p class="sous-titre">Distributeur de gâteries pour chats</p>

    <!-- ================ PHOTO ================ -->
    <div class="carte">
      <div class="ligne">
        <div class="chat"></div>
        <!-- <img class="chat" src="/static/Mochi.png" alt="Photo du chat"> -->
      </div>
    </div>

    <!-- ================ ALERTE CHAT ================ -->
    <div id="alerte-chat" class="carte-alerte">
      Mochi est là !
    </div>

    <!-- ============= ÉTAT ACTUEL ============= -->
    <div class="carte">
      <h2>État du distributeur</h2>
      <div class="ligne">
        <span><span id="pastille" class="statut-pastille"></span>Connexion</span>
        <span id="connexion" class="valeur">--</span>
      </div>
      <div class="ligne">
        <span>Dernière distance mesurée</span>
        <span id="distance" class="valeur">-- cm</span>
      </div>
      <div class="ligne">
        <span>Dernier message reçu</span>
        <span id="dernier-message" class="valeur">--</span>
      </div>
    </div>

    <!-- ============= STATISTIQUES ============= -->
    <div class="carte">
      <h2>Statistiques</h2>
      <div class="ligne">
        <span>Nombre de distributions</span>
        <span id="nb-distributions" class="valeur">0</span>
      </div>
      <div class="ligne">
        <span>Tentatives du chat</span>
        <span id="nb-tentatives" class="valeur">0</span>
      </div>
    </div>

    <!-- ============= CONTRÔLE ============= -->
    <div class="carte">
      <h2>Distribuer maintenant</h2>
      <div class="reglage">
        <label for="portions">Nombre de portions :</label>
        <input id="portions" type="number" min="1" max="10" value="1" />
      </div>
      <button id="bouton-feed" class="bouton">Distribuer</button>
      <div id="message-feed" class="message"></div>
    </div>

  </div>

  <script>
    async function rafraichirEtat() {
      try {
        const rep = await fetch("/api/status");
        const e = await rep.json();

        document.getElementById("connexion").textContent = e.actif ? "Actif" : "Aucun signal";
        document.getElementById("pastille").className = "statut-pastille-" + (e.actif ? "ok" : "erreur");
        document.getElementById("distance").textContent = (e.derniere_distance ?? "--") + " cm";
        document.getElementById("dernier-message").textContent = e.dernier_message ?? "--";
        document.getElementById("nb-distributions").textContent = e.nb_distributions;
        document.getElementById("nb-tentatives").textContent = e.nb_tentatives;

        const alerte = document.getElementById("alerte-chat");
        if (e.derniere_distance !== null && e.derniere_distance <= 15) {
          alerte.classList.add("visible");
        } else {
          alerte.classList.remove("visible");
        }

      } catch (err) {
        console.error("Erreur rafraîchissement :", err);
      }
    }

    async function distribuer() {
      const bouton = document.getElementById("bouton-feed");
      const message = document.getElementById("message-feed");
      const portions = parseInt(document.getElementById("portions").value, 10) || 1;

      bouton.disabled = true;
      message.className = "message";
      message.textContent = "";

      try {
        const rep = await fetch("/api/feed", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ portions: portions }),
        });
        const r = await rep.json();
        message.className = "message ok";
        message.textContent = `Commande envoyée (${r.portions} portion(s)).`;
      } catch (err) {
        message.className = "message erreur";
        message.textContent = "Erreur d'envoi.";
      }

      setTimeout(() => { bouton.disabled = false; }, 2000);
    }

    document.getElementById("bouton-feed").addEventListener("click", distribuer);

    rafraichirEtat();
    setInterval(rafraichirEtat, 500);
  </script>
</body>

</html>
